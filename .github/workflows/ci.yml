name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run check
      - run: mise run build
      - run: ./bin/agent-secrets verify
      - run: mise exec -- go test ./internal/guard -run '^$' -fuzz FuzzCheck -fuzztime 10s
      - run: mise exec -- go test ./internal/guard -run '^$' -fuzz FuzzHook -fuzztime 10s
      - run: mise exec -- go test ./internal/install -run '^$' -fuzz FuzzPrepare -fuzztime 10s
      - run: mise exec -- go test ./internal/install -run '^$' -fuzz FuzzRedactCodexConfig -fuzztime 10s
